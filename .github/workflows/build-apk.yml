name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Extraer proyecto desde ZIP
        run: |
          mkdir -p /tmp/reto 
          unzip -o Reto_Matematico_V5_APK.zip -d /tmp/reto
          cp -a /tmp/reto/settings.gradle .
          cp -a /tmp/reto/build.gradle .
          cp -a /tmp/reto/app .
          cp -a /tmp/reto/README.md . 2>/dev/null || true
          echo "android.useAndroidX=true" > gradle.properties
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Reto-Matematico-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
